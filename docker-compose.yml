# Local stack: API (internal only) + web (published on 127.0.0.1:3000 only; the app has no login).
# Dev Swagger access: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
name: ledgerly

services:
  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    expose:
      - "8000"
    volumes:
      - appdata:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  appdata:
