services:
  backend:
    build: ./backend
    environment:
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - rules-data:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  rules-data:
