services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - app-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
