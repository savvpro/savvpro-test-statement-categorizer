server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The API accepts files up to 5 MB. nginx's default limit is 1 MB.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}