name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .
      - name: Mypy (strict)
        working-directory: backend
        run: uv run mypy app
      - name: Pytest with coverage gate
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=xml --cov-fail-under=85 --junitxml=junit.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/junit.xml
          if-no-files-found: ignore

  brain-eval:
    name: Brain evaluation gate
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run evaluation (gate)
        id: eval
        working-directory: backend
        run: uv run python ../scripts/evaluate_brain.py --json --gate > "$RUNNER_TEMP/eval.json"
      - name: Write metrics to step summary
        if: always()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/eval.json" <<'PY' >> "$GITHUB_STEP_SUMMARY" || echo "_No evaluation metrics produced._"
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, ValueError):
              raise SystemExit(1)

          rows: list[tuple[str, str]] = []

          def walk(prefix: str, value: object) -> None:
              if isinstance(value, dict):
                  for key, sub in value.items():
                      walk(f"{prefix}.{key}" if prefix else str(key), sub)
              elif isinstance(value, (int, float, str, bool)):
                  rows.append((prefix, str(value)))

          walk("", data)
          print("## Brain evaluation metrics")
          print()
          print("| Metric | Value |")
          print("| --- | --- |")
          for name, value in rows:
              print(f"| `{name}` | {value} |")
          PY

  contract:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Export OpenAPI
        working-directory: backend
        run: uv run python ../scripts/export_openapi.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate TypeScript types
        working-directory: frontend
        run: npm run gen:api
      - name: Fail on drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)" || { echo "Untracked or changed generated files:"; git status --porcelain; exit 1; }

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm run test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build

  no-llm-guard:
    name: No LLM dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard brain rule
        run: bash scripts/check_no_llm_deps.sh

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: ledgerly-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: ledgerly-web:ci
          build-args: |
            API_INTERNAL_URL=http://api:8000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Start stack
        run: docker compose up -d --build --wait
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose down -v
