{% extends "base.html" %}
{% block title %}500 Server Error{% endblock %}
{% block content %}
<div class="ll-page-sm" style="text-align:center;padding-top:5rem;">
  <div style="font-size:4rem;margin-bottom:1rem;">⚠️</div>
  <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:0.5rem;">Internal Server Error</h1>
  <p style="color:var(--ll-text-muted);margin-bottom:1rem;">
    Something went wrong processing your request.
  </p>
  {% if detail %}
  <div class="ll-alert ll-alert-error" style="text-align:left;margin-bottom:1.5rem;font-family:'JetBrains Mono',monospace;font-size:0.8rem;">
    {{ detail }}
  </div>
  {% endif %}
  <a href="/" class="ll-btn ll-btn-primary"><i class="bi bi-house"></i> Back to Dashboard</a>
</div>
{% endblock %}
