[project]
name = "statement-categorizer"
version = "0.1.0"
description = "TaxSort – Statement categorizer for US freelancers (Schedule C)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlmodel>=0.0.22,<1",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.12",
    "chardet>=5.2,<6",
    "rapidfuzz>=3.9,<4",
    "pyyaml>=6.0,<7",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
