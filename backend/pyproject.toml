[project]
name = "statement-categorizer"
version = "1.0.0"
description = "Rule-based bank and credit card statement categorizer"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "app.parsing.pdf_reader"
# pdfplumber hands back plain untyped dicts for characters and words.
disallow_any_generics = false
