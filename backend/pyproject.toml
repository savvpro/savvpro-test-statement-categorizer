[project]
name = "ledgerly-api"
version = "1.0.0"
description = "Statement categorizer for small landlords (Schedule E) - API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "python-multipart>=0.0.18",
  "defusedxml>=0.7.1",
  "rapidfuzz>=3.10",
  "pyyaml>=6.0.2",
  "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.118",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "types-defusedxml>=0.7",
  "bandit>=1.8",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "C4", "PT"]
ignore = ["RUF001", "RUF002"]  # intentional unicode (minus sign, curly quotes) in parsers

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "N802", "E501", "SIM105"]
"app/core/errors.py" = ["S101", "N818"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
