<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
  <style>
    .box{fill:#fff;stroke:#287a5b;stroke-width:2}.title{font:700 18px Arial;fill:#17241d}.text{font:14px Arial;fill:#5f7066}.arrow{stroke:#287a5b;stroke-width:3;fill:none}.badge{fill:#eaf5ee}
  </style>
  <rect width="1200" height="270" rx="18" fill="#f7f8f4"/>
  <text x="48" y="46" class="title">FreelanceBooks review flow</text>
  <rect x="48" y="86" width="190" height="112" rx="12" class="box"/><circle cx="82" cy="122" r="18" class="badge"/><text x="114" y="128" class="title">1. Sign in</text><text x="70" y="158" class="text">Choose a permitted</text><text x="70" y="178" class="text">workspace.</text>
  <path d="M238 142h60" class="arrow"/><path d="m288 132 12 10-12 10" class="arrow"/>
  <rect x="300" y="86" width="190" height="112" rx="12" class="box"/><text x="330" y="128" class="title">2. Upload CSV</text><text x="322" y="158" class="text">Validate size, type,</text><text x="322" y="178" class="text">headers and rows.</text>
  <path d="M490 142h60" class="arrow"/><path d="m540 132 12 10-12 10" class="arrow"/>
  <rect x="552" y="86" width="190" height="112" rx="12" class="box"/><text x="582" y="128" class="title">3. Brain decides</text><text x="574" y="158" class="text">Rules, special cases,</text><text x="574" y="178" class="text">confidence and reason.</text>
  <path d="M742 142h60" class="arrow"/><path d="m792 132 12 10-12 10" class="arrow"/>
  <rect x="804" y="86" width="150" height="112" rx="12" class="box"/><text x="831" y="128" class="title">4. Review</text><text x="822" y="158" class="text">Fix uncertain</text><text x="822" y="178" class="text">transactions.</text>
  <path d="M954 142h60" class="arrow"/><path d="m1004 132 12 10-12 10" class="arrow"/>
  <rect x="1016" y="86" width="136" height="112" rx="12" class="box"/><text x="1041" y="128" class="title">5. Learn</text><text x="1032" y="158" class="text">Save private</text><text x="1032" y="178" class="text">workspace rule.</text>
</svg>
